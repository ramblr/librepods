name: Build debug APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Accept licenses and install NDK
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "ndk;30.0.14904198"

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew assembleFossDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
        working-directory: android

      - name: Report failure details
        if: failure()
        run: |
          {
            grep -n -A14 "What went wrong" build.log | head -40
            echo "-----"
            grep -nE "^e: |error:|Could not|not found|NDK|SDK location" build.log | head -25
            echo "-----"
            tail -n 20 build.log
          } > summary.txt
          msg=$(cat summary.txt)
          msg="${msg//'%'/'%25'}"
          msg="${msg//$'\r'/'%0D'}"
          msg="${msg//$'\n'/'%0A'}"
          echo "::error title=Gradle failure::${msg}"

      - uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: android/app/build/outputs/apk/foss/debug/app-foss-debug.apk
